
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Personal Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="card shadow border-0 mx-auto p-4"
         style="max-width: 550px;">

        <div class="text-center mb-4">

            <div class="bg-primary text-white rounded-circle
                        d-flex justify-content-center align-items-center
                        mx-auto mb-3"
                 style="width: 80px; height: 80px; font-size: 30px;">

                {{ request.user.username|first|upper }}

            </div>

            <h3 class="fw-bold">My Profile</h3>
            <p class="text-muted">Manage your account information</p>

        </div>

        <hr>

        <div class="mb-3">
            <label class="text-muted">Username</label>
            <h5>{{ request.user.username }}</h5>
        </div>

        <div class="mb-3">
            <label class="text-muted">Email Address</label>
            <h5>{{ request.user.email }}</h5>
        </div>

        <div class="mb-4">
            <label class="text-muted">Date Joined</label>
            <h5>{{ request.user.date_joined|date:"d M Y" }}</h5>
        </div>

        <a href="{% url 'dashboard' %}" class="btn btn-outline-primary mb-3">
            Dashboard
        </a>

        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger w-100">
                Logout
            </button>
        </form>

    </div>

</div>

</body>
</html>
